# Builds the Astro worker and deploys it to Cloudflare.
# Published Sanity content is fetched on demand, so normal dashboard Publish actions need no rebuild.
#  - push to main ............ deploy code/design changes
#  - pull request ............ preview version with its own URL (not live)
#  - Sanity draft change ..... optional draft-preview rebuild (repository_dispatch "sanity-draft")
# Secrets live in GitHub (Settings -> Secrets and variables -> Actions), never in the code.
name: Deploy
on:
  push: {branches: [main]}
  pull_request:
  repository_dispatch: {types: [sanity-draft]}
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.event.action || 'main' }}
  cancel-in-progress: true
permissions: {contents: read, pull-requests: write}
jobs:
  site:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    env:
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Normalize pasted settings
        working-directory: .
        run: |
          strip_named() {
            name="$1"
            value="$2"
            printf '%s' "$value" | sed -E "s/^[[:space:]]*${name}[[:space:]]*=[[:space:]]*//;s/^[[:space:]]*//;s/[[:space:]]*$//"
          }
          echo "SANITY_PROJECT_ID=$(strip_named "SANITY_PROJECT_ID" "$SANITY_PROJECT_ID")" >> "$GITHUB_ENV"
          echo "SANITY_DATASET=$(strip_named "SANITY_DATASET" "$SANITY_DATASET")" >> "$GITHUB_ENV"
          echo "SITE_URL=$(strip_named "SITE_URL" "$SITE_URL")" >> "$GITHUB_ENV"
          echo "SANITY_READ_TOKEN=$(strip_named "SANITY_READ_TOKEN" "$SANITY_READ_TOKEN")" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$(strip_named "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN")" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(strip_named "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID")" >> "$GITHUB_ENV"
      - name: Cloudflare connected?
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        working-directory: .
        run: echo "::notice::Website not published yet — add CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable), then run this again."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm install
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - name: Production build + deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run build && npx wrangler deploy

      - name: Draft preview build + deploy (password-protect with Cloudflare Access)
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event.action == 'sanity-draft')
        env: {SANITY_PREVIEW: '1', SITE_URL: ''}
        run: npm run build && npx wrangler deploy --env preview

      - name: Pull-request preview version
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'pull_request')
        run: |
          npm run build
          npx wrangler versions upload --message "PR #${{ github.event.number }}"

  # Redeploys the dashboard (Sanity Studio) when studio/ changes. Skipped until the SANITY_DEPLOY_TOKEN secret is added.
  studio:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: studio}}
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST }}
      SANITY_STUDIO_PREVIEW_URL: ${{ vars.SANITY_STUDIO_PREVIEW_URL }}
    steps:
      - name: Normalize pasted settings
        working-directory: .
        run: |
          strip_named() {
            name="$1"
            value="$2"
            printf '%s' "$value" | sed -E "s/^[[:space:]]*${name}[[:space:]]*=[[:space:]]*//;s/^[[:space:]]*//;s/[[:space:]]*$//"
          }
          echo "SANITY_AUTH_TOKEN=$(strip_named "SANITY_AUTH_TOKEN" "$SANITY_AUTH_TOKEN")" >> "$GITHUB_ENV"
          echo "SANITY_STUDIO_PROJECT_ID=$(strip_named "SANITY_STUDIO_PROJECT_ID" "$SANITY_STUDIO_PROJECT_ID")" >> "$GITHUB_ENV"
          echo "SANITY_STUDIO_DATASET=$(strip_named "SANITY_STUDIO_DATASET" "$SANITY_STUDIO_DATASET")" >> "$GITHUB_ENV"
          echo "SANITY_STUDIO_HOST=$(strip_named "SANITY_STUDIO_HOST" "$SANITY_STUDIO_HOST")" >> "$GITHUB_ENV"
          echo "SANITY_STUDIO_PREVIEW_URL=$(strip_named "SANITY_STUDIO_PREVIEW_URL" "$SANITY_STUDIO_PREVIEW_URL")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Did studio/ change?
        id: changed
        working-directory: .
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then echo "yes=$(git diff --name-only HEAD~1 HEAD -- studio | head -1)" >> "$GITHUB_OUTPUT"
          else echo "yes=first-commit" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: env.SANITY_AUTH_TOKEN != '' && steps.changed.outputs.yes != ''
        with: {node-version: 22, cache: npm, cache-dependency-path: studio/package-lock.json}
      - if: env.SANITY_AUTH_TOKEN != '' && steps.changed.outputs.yes != ''
        run: npm ci && npx sanity deploy --yes
